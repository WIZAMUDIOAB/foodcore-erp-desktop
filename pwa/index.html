<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#111827" />
  <title>FoodCore ERP v4.0 — Acceso Tablet Mozos</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <header class="tablet-topbar">
    <div class="brand-cluster">
      <div class="brand-mark">FC</div>
      <div>
        <div class="brand-title">FoodCore</div>
        <span class="brand-subtitle">Tablet POS · Mozos v4.0</span>
      </div>
    </div>

    <div class="topbar-actions">
      <div style="display:flex; gap:8px;">
        <a href="kds/" id="btnDirectoKds" class="btn-touch btn-dark-outline" style="padding: 6px 12px; font-size: 13px;" title="Pantalla de Cocina KDS">👨‍🍳 KDS</a>
        <a href="dashboard/" id="btnDirectoDashboard" class="btn-touch btn-dark-outline" style="padding: 6px 12px; font-size: 13px;" title="Dashboard del Dueño">📊 Dashboard</a>
      </div>
      <div class="connection-pill" id="connectionPill">
        <span class="status-dot online" id="statusDot"></span>
        <span id="statusText">API Online (8080)</span>
        <span class="outbox-badge" id="outboxBadge" style="display:none;">Outbox: 0</span>
      </div>
    </div>
  </header>

  <main class="login-shell">
    <section class="login-card">
      <div class="auth-tabs-toggle">
        <a href="pin-login.html" class="auth-tab-btn" id="tabPinLogin">⚡ Ingreso Rápido con PIN</a>
        <a href="index.html" class="auth-tab-btn active" id="tabPasswordLogin">🔑 Contraseña de Turno</a>
      </div>

      <div class="login-header">
        <h1>Terminal Táctil de Salón</h1>
        <p>Identifíquese para tomar comandas y sincronizar con Cocina (KDS)</p>
      </div>

      <form id="loginForm">
        <div class="form-group">
          <label for="txtUsername">Usuario o Código de Operador</label>
          <input type="text" id="txtUsername" class="form-input" placeholder="Usuario" autocomplete="username" required />
        </div>

        <div class="form-group">
          <label for="txtPassword">Contraseña / PIN de Turno</label>
          <input type="password" id="txtPassword" class="form-input" placeholder="Contraseña" autocomplete="current-password" required />
        </div>

        <div id="loginErrorMsg" class="login-error-banner" role="alert" style="display:none; color:#B91C1C; background:#FEF2F2; border:1px solid #FECACA; padding:10px 14px; border-radius:10px; font-size:13.5px; font-weight:600; margin-bottom:14px;"></div>

        <button type="submit" id="btnIngresar" class="btn-touch btn-primary" style="width:100%; font-size:15.5px; margin-top:6px;">
          Ingresar al Salón de Mesas →
        </button>

        <div style="text-align:center; margin-top:16px;">
          <a href="pin-login.html" id="linkIrPinLogin" style="color:var(--fc-brand-primary); font-weight:700; text-decoration:none; font-size:14px; display:inline-block; padding:6px 12px; border-radius:8px; background:var(--fc-brand-primary-soft);">
            ⚡ ¿Prefiere ingresar con PIN de 4 dígitos? Toque aquí →
          </a>
        </div>
      </form>
    </section>
  </main>

  <div id="toastBanner" class="toast-banner"></div>

  <script src="js/db.js"></script>
  <script src="js/app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      FoodCorePWA.iniciarLoginView();
    });
  </script>
</body>
</html>
