<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#F9F7F4" />
  <title>FoodCore ERP v5.4 — Acceso Tablet Mozos</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <header class="tablet-topbar">
    <div class="brand-cluster">
      <div class="brand-mark">FC</div>
      <div>
        <div class="brand-title">FoodCore</div>
        <span class="brand-subtitle">Tablet POS · Mozos</span>
      </div>
    </div>

    <div class="topbar-actions">
      <div class="topbar-nav-links">
        <a href="kds/" id="btnDirectoKds" class="btn-touch btn-secondary btn-compact-nav" title="Pantalla de Cocina KDS">
          <svg class="ui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 13.87A4 4 0 0 1 7.41 6a5.11 5.11 0 0 1 1.05-1.54 5 5 0 0 1 7.08 0A5.11 5.11 0 0 1 16.59 6 4 4 0 0 1 18 13.87V21H6Z"/><line x1="6" x2="18" y1="17" y2="17"/></svg>
          <span>KDS</span>
        </a>
        <a href="dashboard/" id="btnDirectoDashboard" class="btn-touch btn-secondary btn-compact-nav" title="Dashboard del Dueño">
          <svg class="ui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="18" x2="18" y1="20" y2="10"/><line x1="12" x2="12" y1="20" y2="4"/><line x1="6" x2="6" y1="20" y2="14"/></svg>
          <span>Dashboard</span>
        </a>
      </div>
      <div class="connection-pill" id="connectionPill">
        <span class="status-dot online" id="statusDot"></span>
        <span id="statusText">API Online (8080)</span>
        <span class="outbox-badge" id="outboxBadge" style="display:none;">Outbox: 0</span>
      </div>
      <button type="button" id="btnThemeToggle" class="btn-theme-toggle" aria-label="Cambiar tema claro/oscuro" title="Cambiar tema">
        <svg class="ui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>
      </button>
    </div>
  </header>

  <main class="login-shell">
    <section class="login-card">
      <div class="auth-tabs-toggle">
        <a href="pin-login.html" class="auth-tab-btn" id="tabPinLogin">Ingreso Rápido con PIN</a>
        <a href="index.html" class="auth-tab-btn active" id="tabPasswordLogin">Contraseña de Turno</a>
      </div>

      <div class="login-header">
        <h1>Terminal Táctil de Salón</h1>
        <p>Identifíquese para tomar comandas y sincronizar con Cocina (KDS)</p>
      </div>

      <form id="loginForm">
        <div class="form-group">
          <label for="txtUsername">Usuario o Código de Operador</label>
          <input type="text" id="txtUsername" class="form-input" placeholder="Usuario" autocomplete="username" required />
        </div>

        <div class="form-group">
          <label for="txtPassword">Contraseña / PIN de Turno</label>
          <input type="password" id="txtPassword" class="form-input" placeholder="Contraseña" autocomplete="current-password" required />
        </div>

        <div id="loginErrorMsg" class="login-error-banner" role="alert" style="display:none;"></div>

        <button type="submit" id="btnIngresar" class="btn-touch btn-primary login-submit-btn">
          <span>Ingresar al Salón de Mesas</span>
          <svg class="ui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>
        </button>

        <div class="login-pin-link-wrap">
          <a href="pin-login.html" id="linkIrPinLogin" class="login-pin-link">
            <span>¿Prefiere ingresar con PIN de 4 dígitos? Toque aquí</span>
          </a>
        </div>
      </form>
    </section>
  </main>

  <div id="toastBanner" class="toast-banner"></div>

  <script src="js/db.js"></script>
  <script src="js/app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      FoodCorePWA.iniciarLoginView();
    });
  </script>
</body>
</html>
