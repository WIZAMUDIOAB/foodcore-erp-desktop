<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#111827" />
  <title>FoodCore ERP v4.0 — Acceso Tablet Mozos</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <header class="tablet-topbar">
    <div class="brand-cluster">
      <div class="brand-mark">FC</div>
      <div>
        <div class="brand-title">FoodCore</div>
        <span class="brand-subtitle">Tablet POS · Mozos v4.0</span>
      </div>
    </div>

    <div class="topbar-actions">
      <div class="connection-pill" id="connectionPill">
        <span class="status-dot online" id="statusDot"></span>
        <span id="statusText">API Online (8080)</span>
        <span class="outbox-badge" id="outboxBadge" style="display:none;">Outbox: 0</span>
      </div>
    </div>
  </header>

  <main class="login-shell">
    <section class="login-card">
      <div class="login-header">
        <h1>Terminal Táctil de Salón</h1>
        <p>Identifíquese para tomar comandas y sincronizar con Cocina (KDS)</p>
      </div>

      <div class="quick-users">
        <button type="button" class="quick-user-chip" onclick="FoodCorePWA.rellenarCredencialesDemo('mozo', 'Mozo2026!')">
          👤 Mateo Quispe (Mozo)
        </button>
        <button type="button" class="quick-user-chip" onclick="FoodCorePWA.rellenarCredencialesDemo('admin', 'Admin2026!')">
          🛡️ Administrador
        </button>
      </div>

      <form id="loginForm">
        <div class="form-group">
          <label for="txtUsername">Usuario o Código de Operador</label>
          <input type="text" id="txtUsername" class="form-input" value="mozo" placeholder="Ej. mozo" required />
        </div>

        <div class="form-group">
          <label for="txtPassword">Contraseña / PIN de Turno</label>
          <input type="password" id="txtPassword" class="form-input" value="Mozo2026!" placeholder="••••••••" required />
        </div>

        <button type="submit" class="btn-touch btn-primary" style="width:100%; font-size:15.5px; margin-top:6px;">
          Ingresar al Salón de Mesas →
        </button>
      </form>
    </section>
  </main>

  <div id="toastBanner" class="toast-banner"></div>

  <script src="js/db.js"></script>
  <script src="js/app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      FoodCorePWA.iniciarLoginView();
    });
  </script>
</body>
</html>
