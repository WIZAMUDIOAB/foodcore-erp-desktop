<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FoodCore Gastronomía · Menú Digital</title>
  <link rel="stylesheet" href="css/menu-qr.css">
</head>
<body>
  <header class="glass-header">
    <div class="header-inner">
      <h1>FOODCORE RESTOBAR &amp; GRILL</h1>
      <p>Carta Gastronómica Oficial · Actualizada en Tiempo Real</p>
      <div class="badge-live">&#9679; Disponible para Pedidos</div>
    </div>
  </header>

  <section class="hero-banner" aria-hidden="true">
    <img
      class="hero-parallax-layer parallax-img"
      src="data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1200 320'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0%25' stop-color='%231E293B'/%3E%3Cstop offset='55%25' stop-color='%23334155'/%3E%3Cstop offset='100%25' stop-color='%23FF5A1F'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='1200' height='320' fill='url(%23g)'/%3E%3Ccircle cx='240' cy='160' r='110' fill='rgba(255,90,31,0.22)'/%3E%3Ccircle cx='960' cy='140' r='140' fill='rgba(255,255,255,0.08)'/%3E%3C/svg%3E"
      alt=""
    >
    <div class="hero-banner-overlay">
      <span class="hero-kicker">EXPERIENCIA CULINARIA EN VIVO</span>
      <h2>Sabores Artesanales a la Parrilla</h2>
    </div>
  </section>

  <main class="container">
    <nav id="categoryTabs" class="category-tabs" aria-label="Categorías del menú"></nav>
    <section id="menuGrid" class="grid" aria-live="polite"></section>
  </main>

  <footer>FoodCore ERP v5.4.0 Enterprise · Todos los derechos reservados</footer>

  <aside id="orderSummaryBar" class="order-summary-bar" aria-label="Resumen estimado del pedido">
    <div class="order-summary-inner">
      <div>
        <span id="lblSummaryCaption" class="order-summary-label">Total estimado</span>
        <strong id="orderTotalCount" class="order-summary-count">0 ítems</strong>
      </div>
      <div class="order-summary-right">
        <span id="orderPreviewTotal" class="price" data-value="0.00">S/ 0.00</span>
        <button type="button" id="btnResetPreview" class="btn-reset-preview">Limpiar</button>
      </div>
    </div>
  </aside>

  <script src="js/menu-qr.js"></script>
</body>
</html>
