<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#0D0E11" />
  <title>FoodCore ERP v4.2 — KDS Cocina & Bar</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="stylesheet" href="css/kds.css" />
  <link rel="stylesheet" href="../vendor/fonts/fonts.css" />
</head>
<body>
  <!-- HEADER KDS (MODO OSCURO SAAS) -->
  <header class="kds-topbar">
    <div class="kds-brand">
      <div class="kds-logo">FC</div>
      <div class="kds-title-wrap">
        <h1>KDS Cocina & Bar</h1>
        <span>Estación Central — Turno Activo</span>
      </div>
    </div>

    <div class="kds-topbar-center">
      <button type="button" class="kds-filter-btn active" data-estacion="TODOS">Todos los Platos</button>
      <button type="button" class="kds-filter-btn" data-estacion="COCINA">🍳 Cocina Caliente</button>
      <button type="button" class="kds-filter-btn" data-estacion="BAR">🍹 Bar & Bebidas</button>
    </div>

    <div class="kds-topbar-right">
      <div class="kds-clock" id="lblReloj">12:00:00</div>
      <div class="kds-status-pill">
        <span class="kds-dot"></span>
        <span id="lblEstadoConexion">En Línea</span>
      </div>
      <a href="../mesas.html" class="btn-nav-touch">🍽 Ir a Salón</a>
    </div>
  </header>

  <!-- TABLERO KANBAN KDS -->
  <main class="kds-board">
    <!-- COLUMNA 1: PENDIENTES -->
    <section class="kds-column" id="colWrapperPendiente">
      <div class="kds-col-header">
        <div class="col-header-title">
          <span class="col-indicator ind-pendiente"></span>
          <h2>Pendiente</h2>
        </div>
        <span class="kds-badge-count" id="countPendiente">0</span>
      </div>
      <div class="kds-cards-container" id="colPendiente"></div>
    </section>

    <!-- COLUMNA 2: EN PREPARACIÓN -->
    <section class="kds-column" id="colWrapperPreparacion">
      <div class="kds-col-header">
        <div class="col-header-title">
          <span class="col-indicator ind-preparando"></span>
          <h2>En Preparación</h2>
        </div>
        <span class="kds-badge-count" id="countPreparacion">0</span>
      </div>
      <div class="kds-cards-container" id="colPreparacion"></div>
    </section>

    <!-- COLUMNA 3: LISTO PARA SERVIR -->
    <section class="kds-column" id="colWrapperListo">
      <div class="kds-col-header">
        <div class="col-header-title">
          <span class="col-indicator ind-listo"></span>
          <h2>Listo para Servir</h2>
        </div>
        <span class="kds-badge-count" id="countListo">0</span>
      </div>
      <div class="kds-cards-container" id="colListo"></div>
    </section>
  </main>

  <!-- MODAL AUTENTICACIÓN KDS (Bearer JWT) -->
  <div id="kdsAuthOverlay" style="display:none; position:fixed; inset:0; background:rgba(13,14,17,0.88); backdrop-filter:blur(6px); z-index:9999; align-items:center; justify-content:center; padding:16px;">
    <div style="background:#1E2228; border:1px solid #30363D; border-radius:14px; padding:24px; width:100%; max-width:360px; color:#F0F6FC; box-shadow:0 20px 50px rgba(0,0,0,0.6);">
      <h2 style="margin:0 0 6px; font-size:18px;">Acceso Estación KDS</h2>
      <p style="margin:0 0 16px; font-size:13px; color:#8B949E;">Ingrese credenciales de Cocina o Administrador.</p>
      <div id="kdsLoginError" style="display:none; background:rgba(248,81,73,0.16); color:#FFA198; border:1px solid #F85149; border-radius:8px; padding:8px 10px; font-size:12px; margin-bottom:12px;"></div>
      <label style="display:block; font-size:12px; color:#8B949E; margin-bottom:4px;">Usuario</label>
      <input id="kdsLoginUser" type="text" placeholder="Usuario" autocomplete="username" style="width:100%; padding:10px; border-radius:8px; border:1px solid #30363D; background:#0D1117; color:#F0F6FC; margin-bottom:10px; box-sizing:border-box;" />
      <label style="display:block; font-size:12px; color:#8B949E; margin-bottom:4px;">Contraseña</label>
      <input id="kdsLoginPass" type="password" placeholder="Contraseña" autocomplete="current-password" style="width:100%; padding:10px; border-radius:8px; border:1px solid #30363D; background:#0D1117; color:#F0F6FC; margin-bottom:16px; box-sizing:border-box;" />
      <button id="btnKdsLogin" type="button" style="width:100%; padding:12px; border:none; border-radius:8px; background:#FF5A1F; color:#FFFFFF; font-weight:700; cursor:pointer;">Iniciar Turno KDS</button>
    </div>
  </div>

  <script src="js/kds.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      FoodCoreKDS.init();
    });
  </script>
</body>
</html>
