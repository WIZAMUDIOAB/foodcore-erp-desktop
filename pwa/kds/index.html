<!DOCTYPE html>
<html lang="es" class="dark" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#121211" />
  <title>FoodCore ERP v5.4.0 — KDS Cocina & Bar</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="stylesheet" href="css/kds.css" />
  <link rel="stylesheet" href="../vendor/fonts/fonts.css" />
</head>
<body>
  <!-- HEADER KDS -->
  <header class="kds-topbar">
    <div class="kds-brand">
      <div class="kds-logo">FC</div>
      <div class="kds-title-wrap">
        <h1>KDS Cocina &amp; Bar</h1>
        <span>Estación Central — Turno Activo</span>
      </div>
    </div>

    <div class="kds-topbar-center">
      <button type="button" class="kds-filter-btn active" data-estacion="TODOS">Todos los Platos</button>
      <button type="button" class="kds-filter-btn" data-estacion="COCINA">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2c1.5 3 4 4.5 4 8a4 4 0 1 1-8 0c0-3.5 2.5-5 4-8Z"/></svg>
        Cocina Caliente
      </button>
      <button type="button" class="kds-filter-btn" data-estacion="BAR">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 22h8"/><path d="M12 11v11"/><path d="m19 3-7 8-7-8Z"/></svg>
        Bar &amp; Bebidas
      </button>
    </div>

    <div class="kds-topbar-right">
      <div class="kds-clock" id="lblReloj">12:00:00</div>
      <div class="kds-status-pill" id="kdsStatusPill">
        <span class="kds-dot"></span>
        <span id="lblEstadoConexion">En Línea</span>
      </div>
      <button type="button" id="btnThemeToggle" class="kds-theme-btn" aria-label="Cambiar tema" aria-pressed="true">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
      </button>
      <a href="../mesas.html" class="btn-nav-touch">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 2v7c0 1.1.9 2 2 2h4a2 2 0 0 0 2-2V2"/><path d="M7 2v20"/><path d="M21 15V2a5 5 0 0 0-5 5v6c0 1.1.9 2 2 2h3Zm0 0v7"/></svg>
        Ir a Salón
      </a>
    </div>
  </header>

  <!-- TABLERO KANBAN KDS -->
  <main class="kds-board">
    <!-- COLUMNA 1: PENDIENTES -->
    <section class="kds-column" id="colWrapperPendiente">
      <div class="kds-col-header">
        <div class="col-header-title">
          <span class="col-indicator ind-pendiente"></span>
          <h2>Pendiente</h2>
        </div>
        <span class="kds-badge-count" id="countPendiente">0</span>
      </div>
      <div class="kds-cards-container" id="colPendiente"></div>
    </section>

    <!-- COLUMNA 2: EN PREPARACIÓN -->
    <section class="kds-column" id="colWrapperPreparacion">
      <div class="kds-col-header">
        <div class="col-header-title">
          <span class="col-indicator ind-preparando"></span>
          <h2>En Preparación</h2>
        </div>
        <span class="kds-badge-count" id="countPreparacion">0</span>
      </div>
      <div class="kds-cards-container" id="colPreparacion"></div>
    </section>

    <!-- COLUMNA 3: LISTO PARA SERVIR -->
    <section class="kds-column" id="colWrapperListo">
      <div class="kds-col-header">
        <div class="col-header-title">
          <span class="col-indicator ind-listo"></span>
          <h2>Listo para Servir</h2>
        </div>
        <span class="kds-badge-count" id="countListo">0</span>
      </div>
      <div class="kds-cards-container" id="colListo"></div>
    </section>
  </main>

  <!-- MODAL AUTENTICACIÓN KDS (Bearer JWT) -->
  <div id="kdsAuthOverlay" class="kds-auth-overlay">
    <div class="kds-auth-card">
      <h2 class="kds-auth-title">Acceso Estación KDS</h2>
      <p class="kds-auth-sub">Ingrese credenciales de Cocina o Administrador.</p>
      <div id="kdsLoginError" class="kds-auth-error"></div>
      <label class="kds-auth-label" for="kdsLoginUser">Usuario</label>
      <input id="kdsLoginUser" class="kds-auth-input" type="text" placeholder="Usuario" autocomplete="username" />
      <label class="kds-auth-label" for="kdsLoginPass">Contraseña</label>
      <input id="kdsLoginPass" class="kds-auth-input" type="password" placeholder="Contraseña" autocomplete="current-password" />
      <button id="btnKdsLogin" class="kds-btn-auth" type="button">Iniciar Turno KDS</button>
    </div>
  </div>

  <script src="js/kds.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      FoodCoreKDS.init();
    });
  </script>
</body>
</html>
