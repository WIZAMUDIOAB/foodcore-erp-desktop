# ==============================================================================
# FoodCore ERP v1.0 - Configuración de Producción (SPEC-FOODCORE-v1.0 §10.4, §17.2, R-15)
# ==============================================================================
db.host=127.0.0.1
db.port=3306
db.name=foodcore
db.user=foodcore_app
db.password=${FOODCORE_DB_PASS}

# Credenciales de migración Flyway (solo usadas en bootstrap §12 paso 2)
db.migrator.user=foodcore_migrator
db.migrator.password=${FOODCORE_MIGRATOR_PASS}

# Parámetros HikariCP optimizados para Red Local (LAN)
hikari.maximumPoolSize=10
hikari.minimumIdle=2
hikari.idleTimeout=30000
hikari.connectionTimeout=10000
hikari.maxLifetime=600000

# Socket KDS LAN
kds.socket.port=9090
kds.socket.maxFrameBytes=1048576
