# Configuracion de base de datos MySQL 8 (obligatorio configurar variables de entorno)
# En despliegues monopuesto mantener 127.0.0.1; en LAN restringir puerto 3306 por firewall y exigir TLS.
db.host=127.0.0.1
db.port=3306
db.name=foodcore
db.sslMode=REQUIRED
db.serverTimezone=America/Lima
db.url=jdbc:mysql://127.0.0.1:3306/foodcore?sslMode=REQUIRED&allowPublicKeyRetrieval=true&serverTimezone=America/Lima&characterEncoding=UTF-8
db.user=foodcore_app
db.password=${FOODCORE_DB_PASS}
db.migrator.user=foodcore_migrator
db.migrator.password=${FOODCORE_MIGRATOR_PASS}

socket.kds.port=9090
socket.kds.tls.enabled=false
socket.kds.max.clients=20

api.rest.port=8080
# Politica CORS por defecto en produccion: vacio = deniega origenes cross-origin (solo mismo origen / escritorio).
# Configurar origenes explicitos separados por coma via FOODCORE_CORS_ALLOWED_ORIGINS o cors.allowed.origins (sin '*').
cors.allowed.origins=
app.devLogging=false
jwt.secret=${FOODCORE_JWT_SECRET}
security.auth.rateLimit.max=10
