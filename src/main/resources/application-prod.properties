# Plantilla de configuración de producción — FoodCore ERP
# No hardcodear direcciones IP ni secretos reales en el repositorio.
#
# CORS LAN obligatorio en producción (cuando la PWA u otro cliente autorizado opere en origen distinto):
# Configurar la variable de entorno FOODCORE_CORS_ALLOWED_ORIGINS con la lista explícita de orígenes
# permitidos separados por coma (ej. https://<IP_SERVIDOR_LAN>:8443).
# Nunca usar wildcard '*'. Si cors.allowed.origins permanece vacío en application.properties, se deniega todo CORS externo.
cors.allowed.origins=${FOODCORE_CORS_ALLOWED_ORIGINS}
