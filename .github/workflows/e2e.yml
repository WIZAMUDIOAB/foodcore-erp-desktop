name: Playwright E2E & Java Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  e2e-testing:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Install Playwright Browsers
        run: mvn test-compile exec:java -e -D exec.mainClass=com.microsoft.playwright.CLI -D exec.args="install --with-deps chromium"

      - name: Build and Start FoodCore Server (Javalin)
        run: |
          mvn package -DskipTests
          # Inicia el servidor en segundo plano para que Playwright lo consuma
          nohup java -jar target/foodcore-erp.jar --server > target/server.log 2>&1 &
          # Espera a que el puerto 8080 responda (usando wait-on vía npx o sleep)
          npx --yes wait-on http://localhost:8080/api/health --timeout 30000

      - name: Run E2E Tests (Playwright + TestFX)
        run: mvn test -Dtest="*E2ETest"

      - name: Upload Playwright Report & Screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-evidence
          path: |
            target/playwright-report/
            target/surefire-reports/
          retention-days: 7
