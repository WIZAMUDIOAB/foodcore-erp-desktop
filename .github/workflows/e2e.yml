name: Playwright E2E & Java Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

permissions:
  contents: read

jobs:
  e2e-testing:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      mysql:
        image: mysql:8.0.36
        env:
          MYSQL_ROOT_PASSWORD: ${{ secrets.CI_MYSQL_ROOT_PASSWORD }}
          MYSQL_DATABASE: foodcore_test
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

    env:
      FOODCORE_DB_HOST: 127.0.0.1
      FOODCORE_DB_PORT: 3306
      FOODCORE_DB_NAME: foodcore_test
      FOODCORE_DB_SSL_MODE: REQUIRED
      FOODCORE_DB_USER: foodcore_app
      FOODCORE_MIGRATOR_USER: foodcore_migrator

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Provision Least-Privilege MySQL Accounts (DDL vs DML)
        timeout-minutes: 5
        env:
          CI_MYSQL_ROOT_PASSWORD: ${{ secrets.CI_MYSQL_ROOT_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${CI_MYSQL_ROOT_PASSWORD}" ]; then
            echo "::error::Secret CI_MYSQL_ROOT_PASSWORD is required."
            exit 1
          fi
          if ! command -v mysql >/dev/null 2>&1; then
            sudo apt-get update && sudo apt-get install -y mysql-client
          fi
          MIGRATOR_PASS="$(openssl rand -hex 24)"
          APP_PASS="$(openssl rand -hex 24)"
          echo "::add-mask::$MIGRATOR_PASS"
          echo "::add-mask::$APP_PASS"
          echo "FOODCORE_MIGRATOR_PASS=$MIGRATOR_PASS" >> "$GITHUB_ENV"
          echo "FOODCORE_DB_PASS=$APP_PASS" >> "$GITHUB_ENV"

          MYSQL_CNF=""
          cleanup_cnf() {
            if [ -n "${MYSQL_CNF}" ] && [ -f "${MYSQL_CNF}" ]; then
              rm -f "${MYSQL_CNF}"
            fi
          }
          trap cleanup_cnf EXIT INT TERM
          OLD_UMASK="$(umask)"
          umask 077
          MYSQL_CNF="$(mktemp "${RUNNER_TEMP}/ci_mysql_root_XXXXXX.cnf")"
          umask "${OLD_UMASK}"
          chmod 600 "${MYSQL_CNF}"
          printf '[client]\nuser="root"\npassword="%s"\n' "${CI_MYSQL_ROOT_PASSWORD//\"/\\\"}" > "${MYSQL_CNF}"

          mysql --defaults-extra-file="${MYSQL_CNF}" --host=127.0.0.1 --port=3306 --ssl-mode=REQUIRED <<SQL
          CREATE USER IF NOT EXISTS 'foodcore_migrator'@'%' IDENTIFIED BY '${MIGRATOR_PASS}' REQUIRE SSL;
          CREATE USER IF NOT EXISTS 'foodcore_migrator'@'127.0.0.1' IDENTIFIED BY '${MIGRATOR_PASS}' REQUIRE SSL;
          CREATE USER IF NOT EXISTS 'foodcore_migrator'@'localhost' IDENTIFIED BY '${MIGRATOR_PASS}' REQUIRE SSL;
          GRANT ALL PRIVILEGES ON foodcore_test.* TO 'foodcore_migrator'@'%' WITH GRANT OPTION;
          GRANT ALL PRIVILEGES ON foodcore_test.* TO 'foodcore_migrator'@'127.0.0.1' WITH GRANT OPTION;
          GRANT ALL PRIVILEGES ON foodcore_test.* TO 'foodcore_migrator'@'localhost' WITH GRANT OPTION;

          CREATE USER IF NOT EXISTS 'foodcore_app'@'%' IDENTIFIED BY '${APP_PASS}' REQUIRE SSL;
          CREATE USER IF NOT EXISTS 'foodcore_app'@'127.0.0.1' IDENTIFIED BY '${APP_PASS}' REQUIRE SSL;
          CREATE USER IF NOT EXISTS 'foodcore_app'@'localhost' IDENTIFIED BY '${APP_PASS}' REQUIRE SSL;
          GRANT SELECT, INSERT, UPDATE, DELETE ON foodcore_test.* TO 'foodcore_app'@'%';
          GRANT SELECT, INSERT, UPDATE, DELETE ON foodcore_test.* TO 'foodcore_app'@'127.0.0.1';
          GRANT SELECT, INSERT, UPDATE, DELETE ON foodcore_test.* TO 'foodcore_app'@'localhost';
          FLUSH PRIVILEGES;
          SQL

      - name: Prepare Database with Flyway
        timeout-minutes: 5
        env:
          FLYWAY_URL: jdbc:mysql://127.0.0.1:3306/foodcore_test?sslMode=REQUIRED&allowPublicKeyRetrieval=true&serverTimezone=America/Lima
          FLYWAY_USER: ${{ env.FOODCORE_MIGRATOR_USER }}
          FLYWAY_PASSWORD: ${{ env.FOODCORE_MIGRATOR_PASS }}
        run: mvn -B compile flyway:migrate

      - name: Install Playwright Browsers
        timeout-minutes: 10
        run: mvn -B test-compile exec:java -e -Dexec.mainClass=com.microsoft.playwright.CLI -Dexec.args="install chromium"

      - name: Quality Gate (Maven Verify — Unit, Integration, E2E, Checkstyle, SpotBugs, OWASP)
        timeout-minutes: 20
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
          MONOCLE_HEADLESS: "true"
        run: |
          DC_ARGS=""
          if [ -n "${NVD_API_KEY:-}" ]; then
            DC_ARGS="-DnvdApiKey=${NVD_API_KEY}"
          fi
          mvn -B clean verify \
            -DreuseForks=false \
            -DforkCount=1 \
            -Dtestfx.headless=true \
            -Dtestfx.robot=glass \
            -Dglass.platform=Monocle \
            -Dmonocle.platform=Headless \
            -Dprism.order=sw \
            -Dprism.text=t2k \
            -Djava.awt.headless=true \
            ${DC_ARGS}

      - name: Coverage Gate
        timeout-minutes: 5
        run: mvn -B jacoco:check@jacoco-check

      - name: Reset Database with Flyway for Standalone E2E Server
        timeout-minutes: 5
        env:
          FLYWAY_URL: jdbc:mysql://127.0.0.1:3306/foodcore_test?sslMode=REQUIRED&allowPublicKeyRetrieval=true&serverTimezone=America/Lima
          FLYWAY_USER: ${{ env.FOODCORE_MIGRATOR_USER }}
          FLYWAY_PASSWORD: ${{ env.FOODCORE_MIGRATOR_PASS }}
          FLYWAY_CLEAN_DISABLED: "false"
        run: mvn -B flyway:clean flyway:migrate

      - name: Start FoodCore Server (Javalin)
        timeout-minutes: 5
        run: |
          set -euo pipefail
          OFFLINE_KEY="$(openssl rand -hex 32)"
          JWT_KEY="$(openssl rand -hex 32)"
          KS_PASS="$(openssl rand -hex 16)"
          KS_PATH="$RUNNER_TEMP/e2e-keystore.jks"
          CERT_PATH="$RUNNER_TEMP/foodcore-e2e.cer"
          echo "::add-mask::$OFFLINE_KEY"
          echo "::add-mask::$JWT_KEY"
          echo "::add-mask::$KS_PASS"
          export KS_PASS
          keytool -genkeypair -noprompt \
            -alias foodcore -keyalg RSA -keysize 2048 -storetype PKCS12 -validity 2 \
            -keystore "$KS_PATH" -storepass:env KS_PASS -keypass:env KS_PASS \
            -dname "CN=localhost, OU=FoodCore-CI, O=FoodCore, L=Lima, C=PE" \
            -ext "SAN=DNS:localhost,IP:127.0.0.1"
          keytool -exportcert -noprompt \
            -alias foodcore -keystore "$KS_PATH" -storepass:env KS_PASS -file "$CERT_PATH"
          if [ ! -f target/foodcore-erp.jar ]; then
            mvn -B package -DskipTests
          fi
          FOODCORE_OFFLINE_DB_KEY="$OFFLINE_KEY" FOODCORE_JWT_SECRET="$JWT_KEY" \
            FOODCORE_KEYSTORE_PASS="$KS_PASS" FOODCORE_KEYSTORE_PATH="$KS_PATH" FOODCORE_CERT_PATH="$CERT_PATH" \
            SPRING_PROFILES_ACTIVE="e2e-test" \
            nohup java -Dspring.profiles.active=e2e-test -Dsecurity.auth.rateLimit.max=200 -jar target/foodcore-erp.jar > target/foodcore-server.log 2>&1 &
          SERVER_PID=$!
          echo "SERVER_PID=$SERVER_PID" >> "$GITHUB_ENV"

          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8080/health >/dev/null 2>&1; then
              echo "[OK] FoodCore server healthy on attempt ${i}"
              exit 0
            fi
            if ! kill -0 "$SERVER_PID" 2>/dev/null; then
              echo "::error::FoodCore server process exited unexpectedly during startup."
              exit 1
            fi
            sleep 1
          done
          echo "::error::FoodCore server did not respond healthy on http://127.0.0.1:8080/health within 60s."
          exit 1

      - name: Run E2E Tests (Playwright)
        timeout-minutes: 10
        run: mvn -B test -Dtest="*E2ETest" -DreuseForks=false -DforkCount=1

      - name: Stop FoodCore Server
        if: always()
        timeout-minutes: 2
        run: |
          if [ -n "${SERVER_PID:-}" ]; then
            kill "$SERVER_PID" || true
          fi

      - name: Show Server Log on Failure
        if: failure()
        timeout-minutes: 2
        run: |
          if [ -f target/foodcore-server.log ]; then
            cat target/foodcore-server.log
          else
            echo "target/foodcore-server.log no existe."
          fi

      - name: Upload Playwright Report & Screenshots
        if: always()
        timeout-minutes: 5
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: e2e-evidence
          path: |
            target/playwright-report/
            target/surefire-reports/
            target/foodcore-server.log
          retention-days: 7
