name: Playwright E2E & Java Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  e2e-testing:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: foodcore_test
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

    env:
      FOODCORE_DB_HOST: 127.0.0.1
      FOODCORE_DB_PORT: 3306
      FOODCORE_DB_NAME: foodcore_test
      FOODCORE_DB_USER: root
      FOODCORE_DB_PASS: root
      FOODCORE_MIGRATOR_USER: root
      FOODCORE_MIGRATOR_PASS: root

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Prepare Database with Flyway
        run: |
          mvn compile flyway:migrate -Dflyway.url="jdbc:mysql://127.0.0.1:3306/foodcore_test?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Lima" -Dflyway.user=root -Dflyway.password=root

      - name: Install Playwright Browsers
        run: mvn test-compile exec:java -e -D exec.mainClass=com.microsoft.playwright.CLI -D exec.args="install chromium"

      - name: Start FoodCore Server (Javalin)
        run: |
          mvn package -DskipTests
          java -jar target/foodcore-erp.jar &
          npx wait-on http://localhost:8080 --timeout 60000

      - name: Run E2E Tests (Playwright + TestFX)
        run: mvn test -Dtest="*E2ETest"

      - name: Upload Playwright Report & Screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-evidence
          path: |
            target/playwright-report/
            target/surefire-reports/
          retention-days: 7
