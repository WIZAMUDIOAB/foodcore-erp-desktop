name: Playwright E2E & Java Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  e2e-testing:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0.36
        env:
          MYSQL_ROOT_PASSWORD: ${{ secrets.CI_MYSQL_ROOT_PASSWORD }}
          MYSQL_DATABASE: foodcore_test
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

    env:
      FOODCORE_DB_HOST: 127.0.0.1
      FOODCORE_DB_PORT: 3306
      FOODCORE_DB_NAME: foodcore_test
      FOODCORE_DB_SSL_MODE: REQUIRED
      FOODCORE_DB_USER: foodcore_app
      FOODCORE_MIGRATOR_USER: foodcore_migrator

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Provision Least-Privilege MySQL Accounts (DDL vs DML)
        env:
          CI_MYSQL_ROOT_PASSWORD: ${{ secrets.CI_MYSQL_ROOT_PASSWORD }}
        run: |
          if [ -z "$CI_MYSQL_ROOT_PASSWORD" ]; then
            echo "::error::Secret CI_MYSQL_ROOT_PASSWORD is required."
            exit 1
          fi
          if ! command -v mysql >/dev/null 2>&1; then
            sudo apt-get update && sudo apt-get install -y mysql-client
          fi
          MIGRATOR_PASS="$(openssl rand -hex 24)"
          APP_PASS="$(openssl rand -hex 24)"
          echo "::add-mask::$MIGRATOR_PASS"
          echo "::add-mask::$APP_PASS"
          echo "FOODCORE_MIGRATOR_PASS=$MIGRATOR_PASS" >> "$GITHUB_ENV"
          echo "FOODCORE_DB_PASS=$APP_PASS" >> "$GITHUB_ENV"

          mysql --host=127.0.0.1 --port=3306 --ssl-mode=REQUIRED -u root -p"$CI_MYSQL_ROOT_PASSWORD" <<SQL
          CREATE USER IF NOT EXISTS 'foodcore_migrator'@'%' IDENTIFIED BY '${MIGRATOR_PASS}';
          CREATE USER IF NOT EXISTS 'foodcore_migrator'@'127.0.0.1' IDENTIFIED BY '${MIGRATOR_PASS}';
          CREATE USER IF NOT EXISTS 'foodcore_migrator'@'localhost' IDENTIFIED BY '${MIGRATOR_PASS}';
          GRANT ALL PRIVILEGES ON foodcore_test.* TO 'foodcore_migrator'@'%' WITH GRANT OPTION;
          GRANT ALL PRIVILEGES ON foodcore_test.* TO 'foodcore_migrator'@'127.0.0.1' WITH GRANT OPTION;
          GRANT ALL PRIVILEGES ON foodcore_test.* TO 'foodcore_migrator'@'localhost' WITH GRANT OPTION;

          CREATE USER IF NOT EXISTS 'foodcore_app'@'%' IDENTIFIED BY '${APP_PASS}';
          CREATE USER IF NOT EXISTS 'foodcore_app'@'127.0.0.1' IDENTIFIED BY '${APP_PASS}';
          CREATE USER IF NOT EXISTS 'foodcore_app'@'localhost' IDENTIFIED BY '${APP_PASS}';
          GRANT SELECT, INSERT, UPDATE, DELETE ON foodcore_test.* TO 'foodcore_app'@'%';
          GRANT SELECT, INSERT, UPDATE, DELETE ON foodcore_test.* TO 'foodcore_app'@'127.0.0.1';
          GRANT SELECT, INSERT, UPDATE, DELETE ON foodcore_test.* TO 'foodcore_app'@'localhost';
          FLUSH PRIVILEGES;
          SQL

      - name: Prepare Database with Flyway
        run: |
          mvn compile flyway:migrate \
            -Dflyway.url="jdbc:mysql://127.0.0.1:3306/foodcore_test?sslMode=REQUIRED&allowPublicKeyRetrieval=true&serverTimezone=America/Lima" \
            -Dflyway.user="$FOODCORE_MIGRATOR_USER" \
            -Dflyway.password="$FOODCORE_MIGRATOR_PASS"

      - name: Install Playwright Browsers
        run: mvn test-compile exec:java -e -D exec.mainClass=com.microsoft.playwright.CLI -D exec.args="install chromium"

      - name: Quality Gate (Maven Verify — Unit, Integration, E2E, Checkstyle, SpotBugs)
        run: mvn verify

      - name: Coverage Gate
        run: mvn jacoco:check@jacoco-check

      - name: Start FoodCore Server (Javalin)
        run: |
          nohup java -jar target/foodcore-erp.jar > target/foodcore-server.log 2>&1 &
          echo "SERVER_PID=$!" >> "$GITHUB_ENV"
          npx --yes wait-on http://localhost:8080/health --timeout 60000

      - name: Run E2E Tests (Playwright)
        run: mvn test -Dtest="*E2ETest"

      - name: Stop FoodCore Server
        if: always()
        run: |
          if [ -n "${SERVER_PID:-}" ]; then
            kill "$SERVER_PID" || true
          fi

      - name: Upload Playwright Report & Screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-evidence
          path: |
            target/playwright-report/
            target/surefire-reports/
            target/foodcore-server.log
          retention-days: 7
